spring:
  ai:
    model:
      chat: ${REPAYMENT_AI_PROVIDER:none}
      embedding: none

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${REPAYMENT_AI_MODEL:}
          response-mime-type: application/json
          google-search-retrieval: false

    retry:
      max-attempts: 0

sai:
  repayment:
    ai-request-timeout: PT1M
  calendar:
    proposal-cleanup:
      enabled: ${PREPARATION_PROPOSAL_CLEANUP_ENABLED:false}
      retention: P7D
      chunk-size: 200
      max-chunks: 10
      cron: "0 30 3 * * *"