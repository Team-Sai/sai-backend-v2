spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/sai_backend_test
    username: root
    password: test-only
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/user.sql
        - classpath:db/linked_bank_account.sql
        - classpath:db/account_link_operation.sql
        - classpath:db/bank_transaction.sql
        - classpath:db/bank_transaction_match_candidate.sql
        - classpath:db/identity.sql
        - classpath:db/01_loancontract.sql
        - classpath:db/02_repayment_schedule.sql
        - classpath:db/03_contractchange.sql
        - classpath:db/04_contractaccount.sql
        - classpath:db/recurring_settlement.sql
        - classpath:db/settlement.sql
        - classpath:db/payment.sql
        - classpath:db/settlement_account.sql
        - classpath:db/settlement_invitation.sql
        - classpath:db/settlement_participant.sql
        - classpath:db/settlement_abandonment_alert.sql
        - classpath:db/notification.sql
  batch:
    job:
      enabled: false
    jdbc:
      script-initialization-mode: always

file:
  upload-dir: ${java.io.tmpdir}/sai-backend-test/
sai:
  mock-bank:
    base-url: http://localhost:8081
  backend:
    base-url: http://localhost:8080
app:
  frontend:
    base-url: http://localhost:5173
link-identity:
  hash-secret: test-only-link-identity-hash-secret
link-state:
  secret: dGVzdC1vbmx5LWxpbmstc3RhdGUtc2VjcmV0LTMyLWJ5dGVz
  allowed-return-urls: http://localhost:8080/accounts/link/callback
link-callback:
  api-key: test-only-link-callback-key
slack:
  batch-notification:
    webhook-url: ""
    enabled: false
jwt:
  secret: dGVzdC1vbmx5LWp3dC1zaWduaW5nLXNlY3JldC0zMi1ieXRlcw==
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000
  link-state-expiration-ms: 600000
portone:
  identity:
    base-url: http://localhost
    store-id: test-store
    channel-key: test-channel
    api-secret: test-only-portone-secret
    valid-minutes: 10
account-link:
  max-concurrent: 3
