services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_DB: "k6"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks: [k6net]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [k6net]

  grafana:
    image: grafana/grafana:10.4.3
    depends_on:
      - influxdb
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: blackmirror1-singlestat-math-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks: [k6net]

  dashboard-downloader:
    image: curlimages/curl:8.5.0
    depends_on:
      - grafana
    networks: [k6net]
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/grafana/dashboards
        echo "download k6 dashboard json..."

        curl -fsSL "https://grafana.com/api/dashboards/14801/revisions/2/download" \
          -o /tmp/k6-raw.json || exit 1

        echo "replacing datasource name..."
        sed "s/\$${DS_DUMMY}/InfluxDB/g" /tmp/k6-raw.json \
          > /var/lib/grafana/dashboards/k6.json

        echo "download jvm (micrometer) dashboard json..."
        curl -fsSL "https://grafana.com/api/dashboards/4701/revisions/10/download" \
          -o /tmp/jvm-raw.json || exit 1

        sed "s/\$${DS_PROMETHEUS}/Prometheus/g" /tmp/jvm-raw.json \
          > /var/lib/grafana/dashboards/jvm-micrometer.json

        echo "done"

  k6:
    image: grafana/k6:0.49.0
    depends_on:
      - influxdb
    networks: [k6net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts:/scripts
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    entrypoint: ["k6"]

networks:
  k6net:

volumes:
  influxdb-data:
  grafana-data:
  prometheus-data: